services:
  - type: web
    name: teaching-log-app
    env: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true

  - type: web
    name: teaching-project-app
    env: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: streamlit run project_app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
